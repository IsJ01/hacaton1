# Только бэкенд:            docker compose up --build
# Бэкенд + эмулятор буёв:   docker compose --profile emu up --build
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      SEED_EVENTS: "20"        # история при старте (0 = пустой старт)
      AUTO_EMIT_SEC: "0"       # >0 — сервер сам генерирует события каждые N сек
      SALINITY_NORM: "12.5"
      SALINITY_THRESHOLD: "2.0"

  emulator:
    build: .
    profiles: ["emu"]
    depends_on:
      - backend
    command: ["python", "buoy_emulator.py", "--url", "http://backend:8000", "--audio", "--interval", "3"]
