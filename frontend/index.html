<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эко-Щит Каспия — дашборд инспектора</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Эко-Щит Каспия</h1>
    <span id="status" class="status">подключение…</span>
  </header>

  <div class="layout">
    <main class="main">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="map" role="tab">Карта</button>
        <button class="tab" data-tab="all" role="tab">События</button>
        <button class="tab" data-tab="crit" role="tab">Критические</button>
        <button class="tab" data-tab="forecast" role="tab">Прогноз</button>
      </nav>
      <section class="panel" id="panel-map"><div id="map"></div></section>
      <section class="panel" id="panel-all" hidden>
        <div class="list" id="list-all" data-empty="Событий пока нет"></div>
      </section>
      <section class="panel" id="panel-crit" hidden>
        <div class="list" id="list-crit" data-empty="Критических событий нет"></div>
      </section>
      <section class="panel" id="panel-forecast" hidden>
        <div class="forecast" id="forecast"></div>
      </section>
    </main>

    <aside class="side">
      <h2>Буи</h2>
      <ul class="buoys" id="buoys"></ul>
    </aside>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
